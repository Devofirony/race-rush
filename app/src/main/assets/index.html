<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0918">
<title>Race Rush</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#0d0918;overflow:hidden;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#fff;touch-action:none}
#c{display:block;width:100%;height:100%;position:fixed;inset:0}
.ov{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:16px;text-align:center;z-index:5}
.ov.on{display:flex;animation:fi .25s ease-out}
@keyframes fi{from{opacity:0}to{opacity:1}}
#m{background:linear-gradient(180deg,rgba(13,9,24,.55) 0%,rgba(13,9,24,.25) 35%,rgba(13,9,24,.85) 70%,rgba(13,9,24,.97) 100%)}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:420px;margin:0 auto}

.ci{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc93a 45%,#b8780c);box-shadow:inset 0 0 0 2px #c98a10,0 0 8px #ffc93a88}
.ib{width:42px;height:42px;border-radius:50%;background:rgba(10,6,20,.7);border:1.5px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#fff}
.ib svg{width:22px;height:22px}
.box{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px;padding-top:6px}
.logo{display:flex;flex-direction:column;line-height:.86;font-weight:900;font-style:italic;letter-spacing:1px;transform:rotate(-3deg);margin:4px 0 0}
.logo span{font-size:58px;background:linear-gradient(180deg,#fff6c8 0%,#ffd84a 40%,#ff9a1f 75%,#e0561a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a2a0c) drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.logo span:last-child{font-size:70px;margin-left:44px}
.tagl{font-size:12px;letter-spacing:3px;font-weight:800;color:#c7b8ff;opacity:.9}
.show{position:relative;width:210px;height:210px;margin-top:-4px}
.show canvas{position:absolute;inset:0;width:100%;height:100%}
.ped{position:absolute;left:20px;right:20px;bottom:6px;height:44px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,200,90,.55),rgba(255,140,40,.15) 55%,transparent 72%)}
.ped::after{content:'';position:absolute;left:30px;right:30px;top:12px;bottom:10px;border-radius:50%;border:2px solid rgba(255,220,140,.45)}
.lockb{position:absolute;top:8px;right:14px;background:rgba(10,6,20,.85);border:1.5px solid #ffcf4a66;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:900;color:#ffe08a;display:none}
.hn{display:flex;align-items:baseline;gap:10px;justify-content:center}
.hn b{font-size:30px;font-weight:900;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.race{font-size:12px;font-weight:900;letter-spacing:2px;padding:3px 9px;border-radius:6px;background:#ffffff1a;color:#e8dcff}
.hd{font-size:14px;color:#d9d0f0;min-height:20px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;width:84%;align-items:center;font-size:11px;font-weight:900;letter-spacing:1.5px;color:#a99cd0;text-align:left}
.bar{height:9px;border-radius:9px;background:#ffffff14;overflow:hidden;box-shadow:inset 0 1px 2px #0008}
.bar i{display:block;height:100%;border-radius:9px;transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.roster{display:flex;gap:8px;justify-content:center;margin-top:6px}
.rc{position:relative;width:64px;height:76px;border-radius:14px;background:linear-gradient(180deg,#2a2148,#17112c);border:2px solid #3a2f60;overflow:hidden;transition:transform .15s}
.rc canvas{position:absolute;left:0;top:0;width:60px;height:72px}
.rc.sel{border-color:#ffcf4a;box-shadow:0 0 0 2px #ffcf4a44,0 0 16px #ffcf4a55;transform:translateY(-4px)}
.rc.lk canvas{filter:brightness(.35) saturate(.3)}
.rc .pr{position:absolute;left:0;right:0;bottom:3px;font-size:10px;font-weight:900;color:#ffe08a;text-shadow:0 1px 2px #000}
.rc .lki{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:18px;height:18px}
button{font:inherit;border:0;cursor:pointer;color:inherit}
.big{position:relative;overflow:hidden;font-weight:900;font-size:24px;letter-spacing:2px;min-width:220px;padding:15px 30px;border-radius:18px;background:linear-gradient(180deg,#ffe46a,#ffb21f 55%,#f08a12);color:#4a1d00;box-shadow:0 6px 0 #a54a0a,0 10px 24px rgba(255,150,30,.35),inset 0 2px 0 #fff8c0;text-shadow:0 1px 0 #fff3}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a54a0a,inset 0 2px 0 #fff8c0}
.big::after{content:'';position:absolute;top:0;bottom:0;width:40px;left:-60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sh 2.6s infinite}
@keyframes sh{0%,60%{left:-60px}100%{left:120%}}
.big.dis{filter:grayscale(.8) brightness(.7)}
.sec{font-weight:900;font-size:16px;letter-spacing:1.5px;min-width:220px;padding:12px 24px;border-radius:16px;background:linear-gradient(180deg,#4a3d80,#2e2556);box-shadow:0 5px 0 #1a1436,inset 0 2px 0 #ffffff22}
.sec:active{transform:translateY(3px);box-shadow:0 2px 0 #1a1436}
.best{font-size:12px;font-weight:800;letter-spacing:2px;color:#a99cd0}
.best b{color:#fff}
#msg{color:#ff8a8a;font-size:13px;font-weight:800;min-height:16px}
.dim{background:rgba(8,5,16,.72)}
.card{margin:auto;width:100%;max-width:340px;background:linear-gradient(180deg,#2c2350,#1a1432);border:2px solid #4a3d80;border-radius:24px;padding:26px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 20px 60px #000a,inset 0 1px 0 #ffffff22;position:relative;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-size:34px;font-weight:900;font-style:italic;letter-spacing:1px;color:#ff5a6a;text-shadow:0 3px 0 #6a0a1a}
.card h2.pz{color:#ffd84a;text-shadow:0 3px 0 #7a3a0a}
.bs{font-size:56px;font-weight:900;line-height:1;text-shadow:0 4px 0 #0008}
.lbl{font-size:11px;font-weight:900;letter-spacing:3px;color:#a99cd0;margin-top:-8px}
.rows{width:100%;display:flex;flex-direction:column;gap:6px;margin:4px 0 6px}
.rows div{display:flex;justify-content:space-between;background:#ffffff0d;border-radius:10px;padding:9px 14px;font-weight:800;font-size:15px}
.rows span{color:#b8acdc}
.gold{color:#ffd84a}
.rib{position:absolute;top:-16px;background:linear-gradient(180deg,#ffe46a,#f5a018);color:#4a1d00;font-weight:900;font-size:14px;letter-spacing:2px;padding:6px 18px;border-radius:8px;box-shadow:0 4px 0 #a54a0a;display:none;animation:wob 1s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.06)}}
#pz{position:fixed;top:12px;right:12px;z-index:4;display:none}
</style></head><body>
<canvas id="c"></canvas>

<div class="ov on" id="m">
 <div class="top"><div class="pill"><i class="ci"></i><span id="mc">0</span></div><button class="ib" id="snd"></button></div>

  <div class="logo"><span>RACE</span><span>RUSH</span></div>

  <div class="hn"><b id="hn"></b><span class="race" id="hr"></span></div>
  <div class="hd" id="hd"></div>
  <div class="stats" id="hs"></div>
  <div class="roster" id="ro"></div>
  <div id="msg"></div>
  <button id="go" class="big">PLAY</button>
  <div class="best">BEST SCORE <b id="mb">0</b></div>
 </div>
</div>

<div class="ov dim" id="p"><div class="card">
 <h2 class="pz">PAUSED</h2>
 <button class="big" id="res">RESUME</button>
 <button class="sec" id="snd2">SOUND: ON</button>
 <button class="sec" id="quit">QUIT RUN</button>
</div></div>

<div class="ov dim" id="o"><div class="card">
 <div class="rib" id="nb">NEW BEST!</div>
 <h2>DEFEATED</h2>
 <div class="bs" id="osc">0</div><div class="lbl">SCORE</div>
 <div class="rows">
  <div><span>Stage reached</span><b id="ost">1</b></div>
  <div><span>Enemies slain</span><b id="okl">0</b></div>
  <div><span>Coins earned</span><b class="gold" id="oc">+0</b></div>
 </div>
 <button class="big" id="again">RETRY</button>
 <button class="sec" id="home">HEROES</button>
</div></div>

<script>

const RACES=[

/* ---------- drawing helpers ---------- */

 if(a.wings)for(const s of[-1,1]){g.beginPath();g.moveTo(s*7,ty+4);g.quadraticCurveTo(s*26,ty-28,s*47,ty-12);g.quadraticCurveTo(s*41,ty-5,s*43,ty+6);g.quadraticCurveTo(s*34,ty,s*32,ty+12);g.quadraticCurveTo(s*25,ty+6,s*21,ty+16);g.quadraticCurveTo(s*15,ty+10,s*8,ty+15);g.closePath();fo(g,lin(g,s*46,s*6,'#6a1c26'));

  g.strokeStyle=sh(a.cape,-.35);g.lineWidth=1.2;g.beginPath();for(const x of[-7,0,7]){g.moveTo(x*.7,ty+4);g.lineTo(x,-5)}g.stroke()}
